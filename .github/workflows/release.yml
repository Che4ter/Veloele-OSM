# Push a tag like v1.0 to test, build the bundle and publish a GitHub release
# with the bundle, both routing profiles and the map style as separate files.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest discover -s harness -p 'test_*.py'

      - name: Build bundle
        run: python3 harness/pack_osf.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --notes-file .github/release-notes.md --generate-notes
          "dist/veloele.osf#veloele.osf – complete OsmAnd setup (start here)"
          "profile/veloele.xml#veloele.xml – OsmAnd routing profile only"
          "profile/veloele.brf#veloele.brf – BRouter routing profile"
          "profile/veloele.render.xml#veloele.render.xml – OsmAnd map style only"
